# Saropa Lints Custom Configuration
# This file is read by saropa_lints for additional settings

# Export formats - automatically generate reports after analysis
# Supported formats: sarif, sonar, checkstyle
export_formats:
  - sarif
  - sonar
  - checkstyle

# Optional: customize export paths (full paths)
# Omit for timestamp: reports/saropa/YYYYMMDD_HHMMSS_sonar-lint.EXT
export_filenames:
  sarif: 'reports/saropa/saropa.sarif'
  sonar: 'reports/saropa/sonarqube-results.json'
  checkstyle: 'reports/saropa/checkstyle.xml'

# Maximum issues to track (0 = unlimited, default: 1000)
# After this limit, only ERROR-severity rules continue running
max_issues: 1000

# Platform targeting (enable platforms your project uses)
platforms:
  ios: true
  android: true
  macos: false
  web: false
  windows: false
  linux: false

# Package dependencies (disable packages you don't use)
packages:
  bloc: true
  provider: true
  riverpod: true
  getx: true
  firebase: true
  isar: true
  hive: true
